<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Hilltop Visuals | Links</title>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;500;700&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    
    <style>
        :root {
            --bg-color: #F8F9FA;
            --primary-blue: #1A2B48;
            --text-black: #121212;
            --glass-white: rgba(255, 255, 255, 0.8);
        }

        * { margin: 0; padding: 0; box-sizing: border-box; }

        body {
            background-color: var(--bg-color);
            font-family: 'Inter', sans-serif;
            color: var(--text-black);
            display: flex;
            justify-content: center;
            align-items: center;
            min-height: 100vh;
            overflow-x: hidden;
            position: relative;
        }

        /* Noise texture */
        body::before {
            content: "";
            position: fixed;
            inset: 0;
            opacity: 0.04;
            pointer-events: none;
            background-image: url("data:image/svg+xml,%3Csvg viewBox='0 0 200 200' xmlns='http://www.w3.org/2000/svg'%3E%3Cfilter id='n'%3E%3CfeTurbulence type='fractalNoise' baseFrequency='0.65' numOctaves='3' stitchTiles='stitch'/%3E%3C/filter%3E%3Crect width='100%25' height='100%25' filter='url(%23n)'/%3E%3C/svg%3E");
        }

        /* ── Ambient Orbs ── */
        .orb {
            position: fixed;
            border-radius: 50%;
            filter: blur(72px);
            pointer-events: none;
            will-change: transform, opacity;
        }

        .orb-1 {
            width: 380px; height: 380px;
            background: radial-gradient(circle, rgba(26,43,72,0.38) 0%, transparent 68%);
            top: -90px; left: -110px;
            animation: orbFloat1 20s ease-in-out infinite, orbFade 10s ease-in-out infinite;
        }

        .orb-2 {
            width: 300px; height: 300px;
            background: radial-gradient(circle, rgba(26,43,72,0.30) 0%, transparent 68%);
            bottom: -60px; right: -80px;
            animation: orbFloat2 24s ease-in-out infinite, orbFade 12s ease-in-out infinite;
            animation-delay: -8s, -4s;
        }

        .orb-3 {
            width: 220px; height: 220px;
            background: radial-gradient(circle, rgba(26,43,72,0.22) 0%, transparent 68%);
            top: 38%; left: 62%;
            animation: orbFloat3 16s ease-in-out infinite, orbFade 8s ease-in-out infinite;
            animation-delay: -4s, -2s;
        }

        @keyframes orbFloat1 {
            0%,100% { transform: translate(0, 0) scale(1); }
            33%      { transform: translate(25px, 20px) scale(1.04); }
            66%      { transform: translate(-15px, 35px) scale(0.97); }
        }
        @keyframes orbFloat2 {
            0%,100% { transform: translate(0, 0) scale(1); }
            33%      { transform: translate(-20px, -15px) scale(1.06); }
            66%      { transform: translate(10px, -30px) scale(0.96); }
        }
        @keyframes orbFloat3 {
            0%,100% { transform: translate(0, 0) scale(1); }
            50%      { transform: translate(-25px, 20px) scale(1.08); }
        }
        @keyframes orbFade {
            0%,100% { opacity: 0.55; }
            50%      { opacity: 1; }
        }

        /* ── Container ── */
        .container {
            width: 100%;
            max-width: 400px;
            padding: 40px 20px;
            text-align: center;
            z-index: 1;
        }

        /* ── Profile ──
           WRAPPER = pulse ring (no overflow:hidden so ring is visible)
           INNER   = image clip (overflow:hidden here only) */
        .profile-pulse {
            width: 100px;
            height: 100px;
            border-radius: 50%;
            margin: 0 auto 20px;
        }

        .profile-img {
            width: 100%;
            height: 100%;
            border-radius: 50%;
            background: var(--primary-blue);
            border: 4px solid white;
            box-shadow: 0 10px 25px rgba(0,0,0,0.12);
            overflow: hidden;
            display: flex;
            align-items: center;
            justify-content: center;
        }

        .profile-img img {
            width: 100%;
            height: 100%;
            object-fit: cover;
        }

        @keyframes heartbeat {
            0%   { box-shadow: 0 0 0 0px rgba(26,43,72,0.6); }
            70%  { box-shadow: 0 0 0 18px rgba(26,43,72,0); }
            100% { box-shadow: 0 0 0 0px rgba(26,43,72,0); }
        }

        h1 {
            font-size: 1.5rem;
            font-weight: 700;
            margin-bottom: 10px;
            letter-spacing: -0.5px;
        }

        .description {
            font-size: 0.95rem;
            line-height: 1.6;
            color: #555;
            margin-bottom: 30px;
            font-weight: 300;
        }

        /* ── Links ── */
        .links-wrapper {
            display: flex;
            flex-direction: column;
            gap: 15px;
        }

        .link-card {
            display: flex;
            align-items: center;
            background: var(--glass-white);
            text-decoration: none;
            color: var(--text-black);
            padding: 16px 20px;
            border-radius: 12px;
            border: 1px solid rgba(26, 43, 72, 0.1);
            transition: all 0.3s ease;
            backdrop-filter: blur(5px);
        }

        .link-card:hover {
            transform: translateY(-3px);
            background: var(--primary-blue);
            color: white;
            box-shadow: 0 10px 20px rgba(26, 43, 72, 0.18);
        }

        .link-card i {
            font-size: 1.2rem;
            width: 30px;
            margin-right: 15px;
            text-align: center;
        }

        .link-card span {
            font-weight: 500;
            font-size: 0.95rem;
        }

        .link-card:hover .fa-whatsapp  { color: #25D366; }
        .link-card:hover .fa-instagram { color: #E1306C; }
        .link-card:hover .fa-tiktok    { color: #00f2ea; }

        /* ── Footer ── */
        footer {
            margin-top: 40px;
            font-size: 0.75rem;
            opacity: 0.5;
            text-transform: uppercase;
            letter-spacing: 1px;
        }

        /* ── Entrance stagger ── */
        .profile-pulse, h1, .description, .link-card, footer {
            opacity: 0;
            transform: translateY(16px);
            animation: fadeUp 0.5s ease forwards;
        }
        .profile-pulse  { animation-delay: 0s; }
        h1              { animation-delay: 0.12s; }
        .description    { animation-delay: 0.22s; }
        .link-card:nth-child(1) { animation-delay: 0.32s; }
        .link-card:nth-child(2) { animation-delay: 0.40s; }
        .link-card:nth-child(3) { animation-delay: 0.48s; }
        .link-card:nth-child(4) { animation-delay: 0.56s; }
        .link-card:nth-child(5) { animation-delay: 0.64s; }
        footer          { animation-delay: 0.74s; }

        @keyframes fadeUp {
            to { opacity: 1; transform: translateY(0); }
        }
    </style>
</head>
<body>

    <div class="orb orb-1"></div>
    <div class="orb orb-2"></div>
    <div class="orb orb-3"></div>

    <div class="container">

        <div class="profile-pulse" id="profilePulse">
            <div class="profile-img">
                <img src="logo.png" alt="Hilltop Visuals">
            </div>
        </div>

        <h1>Hilltop Visuals</h1>
        <p class="description">
            We craft high-performance websites and striking brand identities. 
            Blending professional graphics with seamless user experiences 
            to elevate your digital presence.
        </p>

        <div class="links-wrapper">
            <a href="https://hilltopvisuals.name.ng" class="link-card">
                <i class="fas fa-globe"></i>
                <span>Official Portfolio Website</span>
            </a>
            <a href="https://wa.me/+2348133169143" class="link-card">
                <i class="fab fa-whatsapp"></i>
                <span>Chat on WhatsApp</span>
            </a>
            <a href="https://www.instagram.com/nduka8568" class="link-card">
                <i class="fab fa-instagram"></i>
                <span>Follow on Instagram</span>
            </a>
            <a href="https://www.tiktok.com/@chibuzordavid53" class="link-card">
                <i class="fab fa-tiktok"></i>
                <span>Latest on TikTok</span>
            </a>
            <a href="https://www.facebook.com/profile.php?id=100086411674017" class="link-card">
                <i class="fab fa-facebook-f"></i>
                <span>Connect on Facebook</span>
            </a>
        </div>

        <footer>&copy; <span id="footer-year"></span> Hilltop Visuals</footer>
    </div>

    <script>
        // Auto year
        document.getElementById('footer-year').textContent = new Date().getFullYear();

        // Start heartbeat AFTER the entrance fadeUp finishes (0.5s)
        const pulse = document.getElementById('profilePulse');
        pulse.addEventListener('animationend', () => {
            pulse.style.animation = 'heartbeat 2s ease-out infinite';
            pulse.style.opacity   = '1';
            pulse.style.transform = 'translateY(0)';
        }, { once: true });
    </script>

</body>
</html>
