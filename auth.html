<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Sign in — login-with-others</title>
<style>
  :root{
    --bg:#0f1115;--card:#171a21;--line:#262b35;--text:#eef0f3;--muted:#8b93a1;
    --accent:#4f7cff;--accent-ink:#ffffff;--danger:#ff5c5c;--ok:#3ecf8e;--radius:10px;
  }
  *{box-sizing:border-box;}
  body{margin:0;font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,Helvetica,Arial,sans-serif;
    background:var(--bg);color:var(--text);min-height:100vh;display:flex;align-items:center;
    justify-content:center;padding:20px;}
  .card{width:100%;max-width:380px;background:var(--card);border:1px solid var(--line);
    border-radius:var(--radius);padding:28px 24px;}
  h1{font-size:1.15rem;margin:0 0 4px;letter-spacing:-0.01em;}
  .sub{color:var(--muted);font-size:0.85rem;margin:0 0 22px;}
  .tabs{display:flex;border:1px solid var(--line);border-radius:8px;overflow:hidden;margin-bottom:20px;}
  .tab{flex:1;padding:9px 0;text-align:center;background:transparent;border:none;color:var(--muted);
    font-size:0.85rem;cursor:pointer;}
  .tab.active{background:var(--accent);color:var(--accent-ink);}
  label{display:block;font-size:0.75rem;color:var(--muted);margin:14px 0 6px;}
  input[type=email],input[type=password],input[type=text]{width:100%;padding:11px 12px;
    background:#0d0f14;border:1px solid var(--line);border-radius:8px;color:var(--text);font-size:0.9rem;}
  input:focus{outline:2px solid var(--accent);outline-offset:1px;}
  input.code{letter-spacing:6px;font-size:1.2rem;text-align:center;}
  button.primary{width:100%;margin-top:18px;padding:12px 0;background:var(--accent);color:var(--accent-ink);
    border:none;border-radius:8px;font-size:0.9rem;font-weight:600;cursor:pointer;}
  button.primary:disabled{opacity:0.5;cursor:not-allowed;}
  .divider{display:flex;align-items:center;gap:10px;margin:20px 0;color:var(--muted);font-size:0.75rem;}
  .divider::before,.divider::after{content:"";flex:1;height:1px;background:var(--line);}
  button.google{width:100%;padding:11px 0;background:#fff;color:#1f1f1f;border:1px solid var(--line);
    border-radius:8px;font-size:0.87rem;font-weight:600;cursor:pointer;display:flex;align-items:center;
    justify-content:center;gap:10px;}
  .msg{margin-top:14px;font-size:0.8rem;padding:10px 12px;border-radius:8px;display:none;}
  .msg.ok{display:block;background:rgba(62,207,142,0.12);color:var(--ok);border:1px solid rgba(62,207,142,0.3);}
  .msg.err{display:block;background:rgba(255,92,92,0.1);color:var(--danger);border:1px solid rgba(255,92,92,0.3);}
  .hide{display:none !important;}
  .resend{background:none;border:none;color:var(--accent);font-size:0.8rem;cursor:pointer;margin-top:10px;padding:0;}
  .resend:disabled{color:var(--muted);cursor:not-allowed;}
  .timer{color:var(--muted);font-size:0.75rem;margin-top:8px;}
</style>
</head>
<body>

<div class="card">
  <div id="authView">
    <h1>login-with-others</h1>
    <p class="sub" id="subText">Sign in to continue</p>

    <div class="tabs">
      <button class="tab active" id="tabLogin">Log in</button>
      <button class="tab" id="tabSignup">Sign up</button>
    </div>

    <button class="google" id="googleBtn">
      <svg width="18" height="18" viewBox="0 0 18 18"><path fill="#4285F4" d="M17.64 9.2c0-.64-.06-1.25-.16-1.84H9v3.48h4.84a4.14 4.14 0 0 1-1.8 2.72v2.26h2.92c1.7-1.57 2.68-3.88 2.68-6.62z"/><path fill="#34A853" d="M9 18c2.43 0 4.47-.8 5.96-2.18l-2.92-2.26c-.81.54-1.85.86-3.04.86-2.34 0-4.32-1.58-5.03-3.71H.96v2.33A9 9 0 0 0 9 18z"/><path fill="#FBBC05" d="M3.97 10.71a5.4 5.4 0 0 1 0-3.42V4.96H.96a9 9 0 0 0 0 8.08l3.01-2.33z"/><path fill="#EA4335" d="M9 3.58c1.32 0 2.51.46 3.44 1.35l2.59-2.59A9 9 0 0 0 .96 4.96l3.01 2.33C4.68 5.16 6.66 3.58 9 3.58z"/></svg>
      Continue with Google
    </button>

    <div class="divider">or with email</div>

    <label for="email">Email</label>
    <input type="email" id="email" placeholder="you@example.com">

    <label for="password">Password</label>
    <input type="password" id="password" placeholder="At least 6 characters">

    <button class="primary" id="submitBtn">Log in</button>

    <div class="msg" id="msgBox"></div>
  </div>

  <div id="verifyView" class="hide">
    <h1>Enter your code</h1>
    <p class="sub">We sent a 6-digit code to <span id="verifyEmail"></span>. It expires in 10 minutes.</p>
    <label for="codeInput">Code</label>
    <input type="text" id="codeInput" class="code" maxlength="6" placeholder="000000" inputmode="numeric">
    <button class="primary" id="checkCodeBtn">Verify</button>
    <button class="resend" id="resendBtn">Resend code</button>
    <div class="timer" id="timerText"></div>
    <div class="msg" id="verifyMsg"></div>
  </div>
</div>

<!-- EmailJS: free client-side email sending, used only to deliver the 6-digit code -->
<script src="https://cdn.jsdelivr.net/npm/@emailjs/browser@4/dist/email.min.js"></script>

<script type="module">
import { initializeApp } from "https://www.gstatic.com/firebasejs/10.12.2/firebase-app.js";
import {
  getAuth, GoogleAuthProvider, signInWithPopup, createUserWithEmailAndPassword,
  signInWithEmailAndPassword
} from "https://www.gstatic.com/firebasejs/10.12.2/firebase-auth.js";
import {
  getFirestore, doc, setDoc, getDoc
} from "https://www.gstatic.com/firebasejs/10.12.2/firebase-firestore.js";

const firebaseConfig = {
  apiKey: "AIzaSyDUXASCxAqcoJS43V8HFiyDPZknWUDM0Rk",
  authDomain: "login-with-others.firebaseapp.com",
  projectId: "login-with-others",
  storageBucket: "login-with-others.firebasestorage.app",
  messagingSenderId: "421772407076",
  appId: "1:421772407076:web:118d0dfe19675f0e2f03b1"
};

const app = initializeApp(firebaseConfig);
const auth = getAuth(app);
const db = getFirestore(app);
const provider = new GoogleAuthProvider();

// ---- EmailJS: create a free account at https://www.emailjs.com ----
// Add an email service + a template with {{to_email}} and {{code}} variables, then paste the 3 IDs below.
const EMAILJS_PUBLIC_KEY = "RieT2E2Hj35a24vbB";
const EMAILJS_SERVICE_ID = "service_jtplief";
const EMAILJS_TEMPLATE_ID = "template_w64ytxn";

let mode = "login";
let pendingEmail = null;
let cooldownInterval = null;

const els = {
  tabLogin: document.getElementById("tabLogin"),
  tabSignup: document.getElementById("tabSignup"),
  sub: document.getElementById("subText"),
  submitBtn: document.getElementById("submitBtn"),
  googleBtn: document.getElementById("googleBtn"),
  email: document.getElementById("email"),
  password: document.getElementById("password"),
  msgBox: document.getElementById("msgBox"),
  authView: document.getElementById("authView"),
  verifyView: document.getElementById("verifyView"),
  verifyEmail: document.getElementById("verifyEmail"),
  codeInput: document.getElementById("codeInput"),
  checkCodeBtn: document.getElementById("checkCodeBtn"),
  resendBtn: document.getElementById("resendBtn"),
  verifyMsg: document.getElementById("verifyMsg"),
  timerText: document.getElementById("timerText")
};

function setMode(next){
  mode = next;
  els.tabLogin.classList.toggle("active", mode === "login");
  els.tabSignup.classList.toggle("active", mode === "signup");
  els.sub.textContent = mode === "login" ? "Sign in to continue" : "Create your account";
  els.submitBtn.textContent = mode === "login" ? "Log in" : "Sign up";
  hideMsg();
}
els.tabLogin.onclick = () => setMode("login");
els.tabSignup.onclick = () => setMode("signup");
function showMsg(text, type){ els.msgBox.textContent = text; els.msgBox.className = "msg " + type; }
function hideMsg(){ els.msgBox.className = "msg"; }

function genCode(){
  return String(Math.floor(100000 + Math.random() * 900000));
}

async function sendCode(email, uid){
  const code = genCode();
  const expiresAt = Date.now() + 10 * 60 * 1000;
  await setDoc(doc(db, "emailVerifications", uid), { code, expiresAt, email });
  try{
    await window.emailjs.send(EMAILJS_SERVICE_ID, EMAILJS_TEMPLATE_ID,
      { to_email: email, code }, { publicKey: EMAILJS_PUBLIC_KEY });
  }catch(e){
    console.warn("EmailJS not configured yet — code for testing:", code);
  }
  pendingEmail = email;
  els.authView.classList.add("hide");
  els.verifyView.classList.remove("hide");
  els.verifyEmail.textContent = email;
  startCooldown();
}

function startCooldown(){
  let seconds = 30;
  els.resendBtn.disabled = true;
  clearInterval(cooldownInterval);
  cooldownInterval = setInterval(() => {
    seconds--;
    els.timerText.textContent = seconds > 0 ? `Resend available in ${seconds}s` : "";
    if(seconds <= 0){
      clearInterval(cooldownInterval);
      els.resendBtn.disabled = false;
    }
  }, 1000);
}

els.googleBtn.onclick = async () => {
  try{
    await signInWithPopup(auth, provider);
    window.location.href = "dashboard.html";
  }catch(e){ showMsg(e.message, "err"); }
};

els.submitBtn.onclick = async () => {
  hideMsg();
  const email = els.email.value.trim();
  const password = els.password.value;
  if(!email || !password){ showMsg("Enter both email and password.", "err"); return; }
  els.submitBtn.disabled = true;
  try{
    if(mode === "signup"){
      const cred = await createUserWithEmailAndPassword(auth, email, password);
      await sendCode(email, cred.user.uid);
    } else {
      const cred = await signInWithEmailAndPassword(auth, email, password);
      const snap = await getDoc(doc(db, "users", cred.user.uid));
      if(snap.exists() && snap.data().verified){
        window.location.href = "dashboard.html";
      } else {
        await sendCode(email, cred.user.uid);
      }
    }
  }catch(e){ showMsg(e.message, "err"); }
  els.submitBtn.disabled = false;
};

els.checkCodeBtn.onclick = async () => {
  const entered = els.codeInput.value.trim();
  const user = auth.currentUser;
  if(!user){ els.verifyMsg.className = "msg err"; els.verifyMsg.textContent = "Session expired, log in again."; return; }
  const ref = doc(db, "emailVerifications", user.uid);
  const snap = await getDoc(ref);
  if(!snap.exists()){ els.verifyMsg.className = "msg err"; els.verifyMsg.textContent = "No code found — resend one."; return; }
  const data = snap.data();
  if(Date.now() > data.expiresAt){
    els.verifyMsg.className = "msg err"; els.verifyMsg.textContent = "Code expired — resend a new one."; return;
  }
  if(entered !== data.code){
    els.verifyMsg.className = "msg err"; els.verifyMsg.textContent = "Wrong code, try again."; return;
  }
  await setDoc(doc(db, "users", user.uid), { email: data.email, verified: true }, { merge: true });
  window.location.href = "dashboard.html";
};

els.resendBtn.onclick = async () => {
  const user = auth.currentUser;
  if(!user || !pendingEmail) return;
  await sendCode(pendingEmail, user.uid);
  els.verifyMsg.className = "msg ok";
  els.verifyMsg.textContent = "New code sent.";
};

setMode("login");
</script>
</body>
</html>
